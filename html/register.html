<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ChatWorld registration page">
    <title>Register</title>
    <link rel="icon" href="chat-logo.png">
</head>

<body>
    <hero>
        <img src="chat-logo.png" alt="main-logo">
        <h1>Chat World</h1>
    </hero>
    <main>
        <h2>Register</h2>
        <form>
            <table>
                <tr>
                    <td>
                        <p>
                            Email:<input type="text" placeholder="mail123@chat.com">
                        </p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>
                            D.O.B:<input type="date">
                        </p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>
                            Gender:<select>
                                <option>Select</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td><input type="submit"></td>
                </tr>
            </table>
        </form>
    </main>
</body>

</html>
