<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ChatWorld registration page">
    <title>Register</title>
    <link rel="icon" type="image/png" href="/static/assets/chat-logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <img src="/static/assets/chat-logo.png" alt="main-logo">
        <h1>Chat World</h1>
    </header>
    <main>
        <h2>Register</h2>
        <form>

            <label>Email</label>
            <input type="email" placeholder="you@example.com" required>

            <label>Date of Birth</label>
            <input type="date" required>

            <label>Gender</label>

            <select>
                <option>select</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <button>
                Register
            </button>
            <a href="index.html">Already have an account?</a>
        </form>
    </main>
</body>

</html>
